<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="780" viewBox="0 0 1760 780" role="img" aria-labelledby="t d">
<title id="t">One task becomes many</title>
<desc id="d">Six task lanes fan out from one starting point. Dots move along four of them. Two amber dots are parked at a gate and wait for a human. The last lane is dashed: a session with no task.</desc>
<style>
text { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 26px; fill: #A9B4D0; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 24px; }
.w { fill: #EEF1F8; }
.amber { fill: #FFB454; }
.chip { fill: #111933; stroke: #2A3558; }
.chipw { fill: #111933; stroke: #FFB454; stroke-width: 2; }
.chipo { fill: #0A0F1E; stroke: #2A3558; }
</style>
<rect width="1760" height="780" rx="28" fill="#0A0F1E"/>
<g transform="translate(48 40)">
<text x="0" y="36">Every one stops at a different gate, in a different thread.</text>
<text x="0" y="72">Which is waiting for you right now?</text>
